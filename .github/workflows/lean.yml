name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit the Lean development
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
          axiom-audit: "true"
          axiom-audit-root: Aoki
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
      - name: Print axioms of the main theorems
        working-directory: lean
        run: lake env lean AxiomAudit.lean
